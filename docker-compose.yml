services:
  postgres:
    image: postgres:16
    container_name: vulnscout-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    ports:
      - '127.0.0.1:5432:5432'

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  freshrss:
    image: freshrss/freshrss:latest
    container_name: vulnscout-freshrss
    restart: unless-stopped

    environment:
      TZ: Europe/Moscow
      CRON_MIN: '*/20'

    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions

    ports:
      - '127.0.0.1:8080:80'

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vulnscout-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      FRESHRSS_URL: http://freshrss/api/greader.php

    command:
      - python
      - -m
      - app.worker
      - --interval
      - '300'
      - --limit-per-feed
      - '20'
      - --analysis-limit
      - '50'

    depends_on:
      postgres:
        condition: service_healthy
      freshrss:
        condition: service_started

    stop_grace_period: 30s

volumes:
  postgres_data:
  freshrss_data:
  freshrss_extensions:
